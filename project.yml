name: Folio
options:
  bundleIdPrefix: dev.freddiephilpot
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: 1,2
    MARKETING_VERSION: 2.0.1
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  Folio:
    type: application
    platform: iOS
    sources:
    - Scan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.freddiephilpot.folio
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Folio
        INFOPLIST_KEY_NSCameraUsageDescription: Scan handwritten notes into your books.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: true
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Configuration/Folio.entitlements
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your private notes with Face
          ID or your device passcode.
    info:
      path: Configuration/GeneratedInfo.plist
      properties:
        UIBackgroundModes:
        - remote-notification
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
        - CFBundleURLName: dev.freddiephilpot.folio
          CFBundleURLSchemes:
          - folio
    dependencies:
    - target: FolioWidgets
      embed: true
  FolioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: Folio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  FolioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    dependencies:
    - target: Folio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Folio
  FolioWidgets:
    type: app-extension
    platform: iOS
    sources:
    - Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.freddiephilpot.folio.widgets
        GENERATE_INFOPLIST_FILE: true
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: Configuration/WidgetInfo.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleDisplayName: Folio Scan
schemes:
  Folio:
    build:
      targets:
        Folio: all
    test:
      targets:
      - FolioTests
      - FolioUITests
